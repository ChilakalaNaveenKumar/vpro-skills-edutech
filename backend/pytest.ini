[pytest]
testpaths = tests
# -p no:cacheprovider: this sandbox's mounted filesystem can't delete some
# files it creates (a known device-bridge mount-permission quirk, same
# class as the web/mobile dist/ workaround documented in project memory),
# which makes pytest's own .pytest_cache cleanup on exit recurse until
# Python's RecursionError - unrelated to the tests themselves. Disabling
# the cache plugin avoids ever writing that directory in the first place.
addopts = -p no:cacheprovider
