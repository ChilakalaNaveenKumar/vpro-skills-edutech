<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      favicon.ico is first and unsized because it is the one Google fetches for
      the icon beside a mobile search result, and it probes /favicon.ico whether
      or not a page declares it. Without the file that request 404s and the
      result renders with a generic globe.
    -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#14161C" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..400;1,6..72,300..400&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!--
      No <title> or <meta name="description"> here on purpose. React 19 hoists
      the ones rendered by src/seo/Seo.tsx into this head, and it appends rather
      than replaces: with a static description present, the static one came
      first in the document and was the one crawlers read, so every page
      described itself as the home page. Every route renders a <Seo>, so
      removing these leaves no gap - see src/seo/Seo.tsx.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
