# Reverse proxy in front of the backend container (docker-compose.aws.yml).
# Not exposing Uvicorn directly to the internet - this is also the future
# drop-in point for a free Let's Encrypt/Certbot certificate once a real
# domain is pointed at the instance (see docs/AWS_DEPLOYMENT.md's "Adding
# a domain and HTTPS" section - not configured yet, no domain exists yet).

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    gzip          on;
    gzip_types    application/json text/plain;

    log_format main '$remote_addr - [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    # A real precaution against credential-stuffing/brute-force on the
    # one login endpoint this app has - nothing else in the app is
    # rate-limited, since everything else already requires a valid JWT.
    # 5 requests/second per client IP, with a small burst allowance.
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/s;

    upstream backend {
        server backend:8000;
    }

    server {
        listen 80;
        server_name _;

        # Real client IP/scheme, for the backend's own logs (it doesn't
        # currently do IP-based logic, but this is what any future
        # logging/rate-limiting there would need to be accurate).
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location /api/auth/login {
            limit_req zone=login_limit burst=10 nodelay;
            proxy_pass http://backend;
        }

        location / {
            proxy_pass http://backend;
        }
    }
}
